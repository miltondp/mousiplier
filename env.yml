name: mousiplier
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - pandas=1.3.3
  - pip
  - plotnine=0.8.0
  - pyreadr=0.4.6
  - python=3.7.10
  - r-base=4.1.*
  - r-renv
  - r-essentials
  - r-recommended
  - scikit-learn=1.0.2
  - snakemake=6.8.0
    # fixes this issue in snakemake:
    # https://github.com/snakemake/snakemake/issues/1899
  - tabulate=0.8.10
  - tqdm=4.62.3
  - notebook=6.4.11
  - pip:
    - biomart==0.9.2
    - h5py==3.4.0
